services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-familyspace}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-familyspace}
      POSTGRES_DB: ${POSTGRES_DB:-familyspace}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-familyspace}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-familyspace}
      DATABASE_USER: ${POSTGRES_USER:-familyspace}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-familyspace}
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-in-production-min-32-chars!!}
      JWT_ISSUER: ${JWT_ISSUER:-familyspace}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-familyspace-users}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8080}
      UPLOAD_DIR: /app/uploads
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-52428800}
      FIREBASE_ADMIN_JSON: ${FIREBASE_ADMIN_JSON:-/app/firebase-admin.json}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-deceirem@gmail.com}
      HOST: 0.0.0.0
      PORT: 8080
    volumes:
      - uploads_data:/app/uploads
      - ./deploy/firebase-admin.json:/app/firebase-admin.json:ro
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  postgres_data:
  uploads_data:
